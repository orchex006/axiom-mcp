name: Portable MCP native CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.46.3
      - run: python release/build_portable_wheel.py --source-revision "$GITHUB_SHA" --out-dir "${{ runner.temp }}/portable-wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/portable-wheel/*
          if-no-files-found: error
  native:
    needs: package
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            lock: windows-x64
            python: Scripts/python.exe
            core: axiom.exe
          - platform: linux-x64
            os: ubuntu-24.04
            lock: container-linux-x64
            python: bin/python
            core: axiom
          - platform: macos-x64
            os: macos-15-intel
            lock: macos-x64
            python: bin/python
            core: axiom
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      AXIOM_SPECS_ROOT: ${{ github.workspace }}/tests/fixtures/pinned-spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: portable-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/portable-wheel
      - name: Pinned native runtime and required checks
        shell: bash
        run: |
          python -m pip install --require-hashes -r release/${{ matrix.lock }}-py313-requirements.txt
          python -m pip install pytest==9.1.1 ruff==0.15.22 build==1.3.0 setuptools==80.9.0 wheel==0.46.3
          python -m pytest tests -q
          python -m ruff check .
          python -m ruff format --check .
      - uses: actions/checkout@v4
        with:
          repository: orchex006/axiom-graphd
          ref: 846ce6fda31f8589c97f882286590efa3320f277
          path: _ci/core
      - name: Isolate the verified CLI source dependency
        shell: python
        run: |
          import os, pathlib, shutil
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          source = (workspace / '_ci/core').resolve()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-core'
          assert source.is_relative_to(workspace) and (source / '.git').is_dir()
          assert not target.exists()
          shutil.move(str(source), str(target))
          (workspace / '_ci').rmdir()
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/verified-core/target
          key: mcp-core-${{ matrix.platform }}-846ce6f-rust185
      - name: Build the existing verified core CLI dependency
        shell: bash
        working-directory: ${{ runner.temp }}/verified-core
        env:
          AXIOM_BUILD_REVISION: 846ce6fda31f8589c97f882286590efa3320f277
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 build --locked --release -p axiom-cli
      - name: Install the same portable wheel and exercise public processes
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = temporary / 'portable-wheel'
          proof = json.loads((output / 'wheel-provenance.json').read_bytes())
          wheel = output / proof['wheel']
          assert proof['source_revision'] == os.environ['GITHUB_SHA']
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == proof['sha256']
          environment = temporary / 'installed-mcp'
          subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
          python = environment / '${{ matrix.python }}'
          subprocess.run([str(python), '-m', 'pip', 'install', '--require-hashes', '-r', 'release/${{ matrix.lock }}-py313-requirements.txt'], check=True)
          subprocess.run([str(python), '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)
          holder = temporary / ('rust-guard-holder.exe' if os.name == 'nt' else 'rust-guard-holder')
          subprocess.run([sys.executable, 'tests/native/build_rust_holder.py', '--core', str(temporary / 'verified-core'), '--out', str(holder)], check=True)
          env = dict(os.environ, AXIOM_GUARD_HOLDER_ARGV=json.dumps([str(holder)]))
          guard = subprocess.run([sys.executable, '-m', 'pytest', 'tests/test_guard_cross_language.py', 'tests/test_guard_protocol.py', 'tests/test_errors.py', '-q'], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(guard.stdout.decode('utf-8'))
          assert guard.returncode == 0 and b'skipped' not in guard.stdout
          (temporary / 'foreign-guard.txt').write_bytes(guard.stdout)
          proof = {'exit_code': guard.returncode, 'rust_holder_sha256': hashlib.sha256(holder.read_bytes()).hexdigest(), 'stdout_sha256': hashlib.sha256(guard.stdout).hexdigest(), 'source_revision': os.environ['GITHUB_SHA']}
          (temporary / 'guard-proof.json').write_text(json.dumps(proof))
          subprocess.run([sys.executable, 'tests/native/portable_readiness.py', '--python', str(python), '--wheel', str(wheel), '--core', str(temporary / 'verified-core/target/release/${{ matrix.core }}'), '--guard-proof', str(temporary / 'guard-proof.json'), '--source-revision', os.environ['GITHUB_SHA'], '--out', str(temporary / 'native-report.json')], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-report.json
            ${{ runner.temp }}/guard-proof.json
            ${{ runner.temp }}/foreign-guard.txt
          if-no-files-found: error
