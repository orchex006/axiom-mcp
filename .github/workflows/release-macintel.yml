name: Release 0.1.1 for MacIntel testing
on:
  push:
    branches: [release/v0.1.1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.1.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify
        shell: bash
        env:
          OUT: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.46.3
          python -m build --outdir "$OUT"
          cp release/macos-x64-py313-requirements.txt "$OUT/"
          python -m pip download --require-hashes --only-binary=:all: -r release/macos-x64-py313-requirements.txt -d "$RUNNER_TEMP/wheelhouse"
          tar -czf "$OUT/axiom-mcp-0.1.1-macos-x64-wheelhouse.tar.gz" -C "$RUNNER_TEMP/wheelhouse" .
          python -m pip install '.[dev]'
          python -m pytest tests -q
          python -m ruff check .
          python -m ruff format --check .
          cp release/v0.1.1-notes.md "$OUT/RELEASE-NOTES.md"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE-REVISION.txt"
          cd "$OUT"
          shasum -a 256 * > SHA256SUMS
      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUT: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          if gh release view v0.1.1 --json isDraft >/dev/null 2>&1; then
            test "$(gh release view v0.1.1 --json isDraft --jq .isDraft)" = true
          else
            gh release create v0.1.1 --target "$GITHUB_SHA" --draft --title '0.1.1 — MacIntel test release' --notes-file release/v0.1.1-notes.md
          fi
          gh release upload v0.1.1 "$OUT"/* --clobber
          gh release edit v0.1.1 --draft=false --latest
          gh release view v0.1.1 --json url,tagName,isDraft,assets >> "$GITHUB_STEP_SUMMARY"
