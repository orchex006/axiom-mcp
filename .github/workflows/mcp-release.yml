name: Portable MCP GitHub Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: portable-mcp-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/mcp-ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: checked-inputs
      - name: Verify tag and publish the one checked portable wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c "import os,re; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['RELEASE_TAG'])"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python release/collect_portable_assets.py --input checked-inputs --source-revision "$GITHUB_SHA" --out release-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing Release is immutable; refusing replacement' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Axiom MCP $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md
