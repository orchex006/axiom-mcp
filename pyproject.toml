[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-mcp"
version = "0.1.0"
description = "Axiom Graph Ecosystem processed-JSON query gateway over local MCP transports"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mcp==1.28.1",
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
  "starlette==1.3.1",
  "pydantic==2.13.4",
  "anyio==4.14.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[project.scripts]
axiom-mcp = "axiom_mcp.cli:main"
# The locked launch surface, so a version environment can be asked for its own plan
# by name as well as through `python -m axiom_mcp.entrypoints`.
axiom-mcp-entrypoints = "axiom_mcp.entrypoints:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The package README ships inside the payload: `readme = "README.md"` only puts the text in
# METADATA, which is not a file a package-only consumer can read. `src/axiom_mcp/README.md` is a
# copy of the repository README and `tests/test_package_readme.py` fails when the two diverge.
[tool.setuptools.package-data]
axiom_mcp = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
